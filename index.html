<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Interception Funders Explorer</title>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&family=DM+Mono:wght@400;500&display=swap">
<style>
/* Layout: three panes after the GEE gastric explorer. Dark navigation rail, paper reading column, evidence panel. */
:root{
  --paper:#f8f6f1; --card:#fdfcf8; --ink:#212e3b; --head:#26373a; --muted:#5b6a66; --line:#e3ded2;
  --rail:#19252a; --rail-ink:#f7f0e2; --rail-muted:#8fa09b; --rail-hi:#24363c; --gold:#d6a24a;
  --teal:#2f6f6a; --teal-soft:#e2efec; --teal-line:#bcd9d3; --amber:#c9743a; --amber-soft:#f6e6d8;
  --slate:#5c6874; --slate-soft:#e9ecef;
  --display:"Instrument Serif",Georgia,"Times New Roman",serif;
  --sans:"DM Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"DM Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:light;
}
html,body{height:100%}
body{background:var(--paper);color:var(--ink);font:16px/1.6 var(--sans);margin:0}
.app{display:grid;grid-template-columns:260px minmax(0,1fr) 360px;height:100%}
/* rail */
.rail{background:var(--rail);color:var(--rail-ink);overflow-y:auto;padding:22px 18px 28px}
.brand{display:flex;gap:12px;align-items:center;margin-bottom:26px}
.badge{width:40px;height:40px;border-radius:10px;background:var(--gold);color:var(--rail);font:600 13px var(--mono);display:grid;place-items:center;flex:none}
.brand .k{font:500 11px var(--mono);letter-spacing:.12em;color:var(--gold)}
.brand .t{font:600 16px/1.25 var(--sans)}
.eyebrow{font:500 11px/1.5 var(--mono);letter-spacing:.12em;text-transform:uppercase}
.rail .eyebrow{color:var(--rail-muted);margin:18px 0 8px 6px}
.rail .grp{color:var(--gold);font-size:10.5px;margin:16px 0 6px 6px}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{all:unset;box-sizing:border-box;display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;padding:9px 12px;border-radius:8px;font:15px/1.35 var(--sans);color:var(--rail-ink);cursor:pointer}
.nav button:hover{background:var(--rail-hi)}
.nav button[aria-current="true"]{background:var(--rail-hi);box-shadow:inset 3px 0 0 var(--gold)}
.nav .n{font:12px var(--mono);color:var(--rail-muted)}
.nav button:focus-visible{outline:2px solid var(--gold);outline-offset:1px}
/* center */
.center{overflow-y:auto}
.bar{position:sticky;top:0;z-index:3;background:var(--paper);border-bottom:1px solid var(--line);padding:14px 32px;display:flex;gap:12px;align-items:center}
.search{flex:1;max-width:420px;display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 12px}
.search input{all:unset;flex:1;font:15px var(--sans);color:var(--ink);min-width:0}
.search svg{flex:none}
.read{max-width:760px;padding:34px 40px 80px}
.crumb{display:flex;flex-wrap:wrap;gap:10px;align-items:center;color:var(--muted)}
.pill{font:500 11px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--teal);background:var(--teal-soft);border:1px solid var(--teal-line);border-radius:999px;padding:4px 10px}
h1{font:400 clamp(38px,5vw,58px)/1.05 var(--display);color:var(--head);margin:18px 0 22px;letter-spacing:-.01em;text-wrap:balance}
h2{font:400 34px/1.15 var(--display);color:var(--head);margin:8px 0 16px;text-wrap:balance}
h3{font:600 15px/1.4 var(--sans);color:var(--head);margin:26px 0 10px}
p{margin:0 0 14px;max-width:66ch}
.prose p{font:400 21px/1.6 var(--display);color:var(--ink)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px 20px}
.qcard ol{margin:10px 0 12px;padding:0;list-style:none}
.qcard li{display:flex;gap:12px;font-size:18px;line-height:1.5}
.qn{flex:none;width:22px;height:22px;border-radius:50%;background:var(--teal-soft);color:var(--teal);font:500 12px var(--mono);display:grid;place-items:center;margin-top:3px}
.qcard .who{border-top:1px solid var(--line);padding-top:10px;color:var(--muted)}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin:22px 0 8px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.stat .v{font:400 38px/1.1 var(--display);margin:6px 0 4px}
.stat .d{font-size:13px;color:var(--muted);line-height:1.4}
.c-teal{color:var(--teal)} .c-amber{color:var(--amber)} .c-slate{color:var(--slate)}
.fl{color:inherit;text-decoration:none;border-bottom:1px dotted var(--teal);cursor:pointer}
.fl:hover{background:var(--teal-soft)}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--card)}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;vertical-align:top;padding:10px 12px;border-bottom:1px solid var(--line)}
th{font:500 11px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
tr:last-child td{border-bottom:0}
.chip{display:inline-block;font:500 11px/1.4 var(--mono);letter-spacing:.06em;text-transform:uppercase;padding:3px 9px;border-radius:999px;white-space:nowrap}
.s-known{color:var(--teal);background:var(--teal-soft)}
.s-possible{color:var(--amber);background:var(--amber-soft)}
.s-none{color:var(--slate);background:var(--slate-soft)}
ul.f,ol.f{padding-left:20px;max-width:66ch} ul.f li,ol.f li{margin-bottom:9px}
.rec{display:block;width:100%;text-align:left;font:inherit;color:inherit;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:10px;cursor:pointer}
.rec:hover{border-color:var(--teal-line)}
.rec[aria-pressed="true"]{border-color:var(--teal);box-shadow:0 0 0 1px var(--teal)}
.rec .top{display:flex;justify-content:space-between;gap:10px;align-items:start}
.rec .nm{font-weight:600}
.rec .ev{font-size:14px;color:var(--muted);margin-top:4px}
.rec .meta{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:8px;font:12px var(--mono);color:var(--muted)}
.caution{border-left:3px solid var(--amber);background:var(--amber-soft);padding:12px 16px;border-radius:0 10px 10px 0;margin:0 0 18px;max-width:66ch}
.field{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:10px}
.field label{font-weight:600;display:block}
.field .fd{color:var(--muted);font-size:14px;margin:2px 0 6px}
.field .fa{font-size:14px;margin-bottom:6px}
textarea{width:100%;box-sizing:border-box;min-height:70px;font:15px/1.5 var(--sans);color:var(--ink);background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:9px}
textarea:focus-visible,.search:focus-within{outline:2px solid var(--teal);outline-offset:1px}
.btn{font:600 15px var(--sans);color:#fff;background:var(--teal);border:0;border-radius:10px;padding:11px 18px;cursor:pointer}
.btn.ghost{background:none;color:var(--teal);border:1px solid var(--teal)}
.btn:disabled{opacity:.6;cursor:default}
.actions{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin:16px 0}
#status{font-size:14px;color:var(--muted)}
.addr{font:500 14px var(--mono);user-select:all;background:var(--teal-soft);padding:2px 8px;border-radius:6px}
.note{font-size:14px;color:var(--muted)}
/* evidence panel */
.panel{background:#f3f0e8;border-left:1px solid var(--line);overflow-y:auto;padding:0 22px 40px}
.panel .ph{position:sticky;top:0;background:#f3f0e8;display:flex;justify-content:space-between;align-items:center;padding:20px 0 14px;color:var(--muted);z-index:2}
.panel h2{font-size:32px;margin-top:4px}
.panel .tierline{display:flex;justify-content:space-between;gap:8px;align-items:center;color:var(--muted)}
.pbox{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin:12px 0}
.pbox .eyebrow{color:var(--muted);margin-bottom:6px}
.pbox dl{margin:0;display:grid;gap:8px}
.pbox dt{font:500 10.5px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.pbox dd{margin:0;font-size:14.5px;overflow-wrap:anywhere}
.ex{background:var(--teal-soft);border:1px solid var(--teal-line);border-radius:14px;padding:14px 16px;margin:12px 0}
.ex .eyebrow{color:var(--teal);margin-bottom:6px}
.ex q{display:block;font:400 19px/1.4 var(--display);color:var(--head);quotes:"\201C" "\201D"}
.ex .src{font-size:13px;margin-top:8px;color:var(--muted)}
.ex .src a{color:var(--teal)}
.close{display:none;font:600 14px var(--sans);background:none;border:1px solid var(--line);border-radius:8px;padding:6px 10px;cursor:pointer;color:var(--ink)}
/* responsive */
@media (max-width:1180px){
  .app{grid-template-columns:240px minmax(0,1fr)}
  .panel{position:fixed;top:0;right:0;bottom:0;width:min(420px,100%);box-shadow:-12px 0 30px rgba(25,37,42,.18);transform:translateX(105%);transition:transform .2s;z-index:10}
  .panel.open{transform:none}
  .close{display:inline-block}
}
@media (max-width:760px){
  .app{display:block;height:auto}
  .rail{padding:16px}
  .brand{margin-bottom:10px}
  .rail .eyebrow,.rail .grp{display:none}
  .nav{flex-direction:row;flex-wrap:wrap;gap:6px}
  .nav button{width:auto;border:1px solid #33464d;padding:7px 12px;font-size:14px}
  .nav .n{display:none}
  .center{overflow:visible}
  .bar{padding:12px 16px}
  .bar .eyebrow{display:none}
  .read{padding:24px 16px 60px}
  .stats{grid-template-columns:1fr}
  .prose p{font-size:19px}
}
@media (prefers-reduced-motion:reduce){.panel{transition:none}}
</style></head><body>

    <li>Before contacting any other KRAS company, obtain the material-transfer and exclusivity terms with Revolution Medicines.</li>
    <li>By 2 November 2026, decide whether to submit a PREVENT concept application, conditional on Revolution Medicines permitting NCI contract work on its compounds.</li>
    <li>By 9 December 2026, apply for the PanCAN Career Development Award after confirming the years-in-faculty rule.</li>
    <li>Ask Altaf Mohammed, program officer of R01CA303474, which NCI career and prevention mechanisms fit a first independent award after PAR-25-167 expires on 8 January 2027.</li>
    <li>Ask the Penn Pancreatic Cancer Research Center's major gifts officer, listed on its donation page, which Penn donors fund pancreatic interception, and check eligibility for the Stephenson Scholar Grants before the 2027 cycle opens.</li>
    <li>Ask Mark O'Hara, a 2024 co-author and FY2026 Lustgarten awardee, how Lustgarten receives interception proposals.</li>
  </ol>
  <p class="note">Main uncertainties: the Science 2026 funding acknowledgments and the Revolution Medicines agreement terms were not read; Lustgarten's intake route is not public; FY2027 DoD and NIH reissue dates are not announced.</p>`;
}
function findId(word){const f=FUNDERS.find(x=>x.name.includes(word)); return f?f.funder_id:"";}

function request(){
  const rows=[["Decision supported","Which funders to approach first, and how","Inferred from the wording of the request"],
  ["Type of answer","Ranked list of funders","Set for this report, based on the wording \"show me funders/sponsors\""],
  ["Population","People without cancer at elevated inherited or precursor risk","Inferred from the Science 2026 paper"],
  ["Priority condition","Pancreatic cancer first; a priority, not a limit","Set for this report, based on Dr. Than's publication record as of 4 October 2026"],
  ["Scope","Pancreatic prevention first; then BRCA-associated breast, ovarian and prostate; then general prevention","Set for this report, based on Dr. Than's interception work"],
  ["Intervention types","Small molecule drugs and vaccines","Taken from the request"],
  ["Key terms","No cancer diagnosis; recurrence prevention, HPV and hepatitis B vaccines excluded; \"interested\" requires an award, trial, open call or stated priority since 2022","Set for this report, based on the wording of the request"],
  ["Geography and evidence window","United States, plus non-US funders that accept US investigators; evidence from 2022 onward","Standard setting; not specified in the request"],
  ["Existing relationships","Revolution Medicines, funders named in Dr. Than's publications, and Basser","Set for this report, based on public records and publication acknowledgments"],
  ["Constraints","None assumed","Standard setting; not specified in the request"]];
  return `<div class="crumb"><span class="pill">Request</span></div><h1>How the request was read</h1>
  <p><b>The request.</b> "Show me funders/sponsors that would be interested in cancer prevention using small molecule drugs or vaccines" (email of 28 September 2026).</p>
  <p><b>Requested by.</b> Minh T. Than, MD, PhD, Assistant Professor of Medicine, Division of Hematology and Oncology, Abramson Cancer Center, University of Pennsylvania. Medical oncologist and physician-scientist specializing in pancreatic cancer; lead author of "Cancer interception with KRAS inhibitors in preclinical models of pancreatic ductal adenocarcinoma" (Science, 2026). <span class="note">Source: <a class="fl" href="https://www.pennmedicine.org/providers/minh-than" target="_blank" rel="noopener">Penn Medicine provider profile</a>, read 4 October 2026.</span></p>
  <p>The request did not specify the parameters below. Each row states the reading this report used and its basis.</p>
  <div class="tablewrap"><table><thead><tr><th>Parameter</th><th>Reading used</th><th>Basis</th></tr></thead><tbody>
  ${rows.map(r=>`<tr><td><b>${esc(r[0])}</b></td><td>${esc(r[1])}</td><td>${esc(r[2])}</td></tr>`).join("")}</tbody></table></div>
  <p class="note" style="margin-top:14px">To correct or refine any reading, use <a class="fl" data-go="refine">Refine this request</a>.</p>`;
}

function rec(f){
  const st=STAT[f.status];
  return `<button class="rec" data-f="${f.funder_id}" aria-pressed="${selected===f.funder_id}"><div class="top"><span class="nm">${esc(f.name)}</span><span class="chip ${st[1]}">${st[0]}</span></div>
  <div class="ev">${esc(f.evidence_of_interest)}</div>
  <div class="meta"><span>${esc(f.tier)}</span><span>Pancreatic: ${esc(f.pancreatic_coverage)}</span>${f.open_calls_oct2026_oct2027&&!/^not found|^none/i.test(f.open_calls_oct2026_oct2027)?`<span>Calls: ${esc(f.open_calls_oct2026_oct2027)}</span>`:""}</div></button>`;
}
function list(label){
  const fs=ranked.filter(f=>f.list===label).sort((a,b)=>tierIdx(a.tier)-tierIdx(b.tier)||b.score-a.score);
  const intro=label==="Individuals and families"?`<p>Individuals, families and family-founded charities with a public record of giving to pancreatic cancer, BRCA or cancer prevention research, from 2022 onward except where an entry dates older evidence. Sources are institutional announcements, foundation websites and published donor lists; only public giving is reported. Introductions to Penn donors run through Penn Medicine Development, not through Dr. Than directly.</p>`:"";
  return `<div class="crumb"><span class="pill">Funders</span><span class="eyebrow">${fs.length} ranked · ${fs.filter(f=>f.status==="known").length} with an existing relationship</span></div>
  <h1>${esc(label)}</h1>${intro}<p class="note">Ordered by tier, then score. Select a funder to see its evidence, how to apply, and sources.</p>${fs.map(rec).join("")}`;
}
function outside(){
  const fs=FUNDERS.filter(f=>f.list==="Out of the box");
  return `<div class="crumb"><span class="pill">Funders</span></div><h1>Funders outside the field</h1>
  <p>These funders have no documented activity in pancreatic or BRCA prevention, so a search confined to the field would not return them. Each has a documented connection that makes interest plausible. They are hypotheses, not ranked results.</p>
  <div class="caution">Before any approach to a KRAS company other than Revolution Medicines, obtain the material-transfer and exclusivity terms with Revolution Medicines. Those terms may limit work with competing compounds. This is an inference: the terms were not reviewed.</div>
  ${fs.map(rec).join("")}`;
}
function searchView(){
  const q=query.toLowerCase();
  const fs=FUNDERS.filter(f=>[f.name,f.who,f.evidence_of_interest,f.intake_route,f.open_calls_oct2026_oct2027,f.concept].join(" ").toLowerCase().includes(q));
  return `<div class="crumb"><span class="pill">Search</span></div><h1>${fs.length} result${fs.length===1?"":"s"}</h1>${fs.length?fs.map(rec).join(""):`<p class="note">No funder matches "${esc(query)}".</p>`}`;
}
function refine(){
  let part="", html=`<div class="crumb"><span class="pill">Respond</span></div><h1>Refine this request</h1>
  <p>This report was produced from a single-sentence request, so several parameters were set without your input. Each field below shows the parameter, what this report assumed, and a box for your answer.</p>
  <p><b>How to respond:</b> type your answer in the box under any field, then select "Send my answers." Your answers go directly to <span class="addr">lauren@laurenberkowitz.co</span>.</p>
  <p class="note">Every field is optional. A field left blank keeps the assumption shown. Each answer narrows the search and changes the ranking in the next version.</p><form id="rf" novalidate>`;
  FORM.forEach(q=>{
    if(q.part!==part){part=q.part; html+=`<h3>${esc(part)}</h3>${q.partNote?`<p class="note">${esc(q.partNote)}</p>`:""}`;}
    html+=`<div class="field"><label for="q_${q.id}">${esc(q.id)}. ${esc(q.title)}</label>${q.desc?`<div class="fd">${esc(q.desc)}</div>`:""}
    <div class="fa"><b>${esc(q.alabel)}</b> ${esc(q.assumed)}</div><div class="fa"><b>Your answer:</b>${q.hint?` <span class="fd">${esc(q.hint)}</span>`:""}</div>
    <textarea id="q_${q.id}" data-q="${q.id}"></textarea></div>`;
  });
  html+=`<div class="actions"><button class="btn" type="submit" id="sendBtn">Send my answers</button><button class="btn ghost" type="button" id="copyBtn">Copy my answers instead</button><span id="status" aria-live="polite"></span></div>
  <div id="fbw" hidden><p class="note">Select the text below and copy it into an email to lauren@laurenberkowitz.co.</p><textarea id="fb" readonly style="min-height:160px"></textarea></div></form>`;
  return html;
}
const drafts={};
function wireForm(){
  const form=document.getElementById("rf"); if(!form) return;
  form.querySelectorAll("textarea[data-q]").forEach(t=>{t.value=drafts[t.dataset.q]||""; t.addEventListener("input",()=>drafts[t.dataset.q]=t.value);});
  const st=document.getElementById("status");
  const collect=()=>{const lines=["Refine this request: answers from Minh Than",""],data={};let n=0;
    FORM.forEach(q=>{const v=(drafts[q.id]||"").trim(); if(v){n++; data[`${q.id}. ${q.title}`]=v; lines.push(`${q.id}. ${q.title}`,`Assumed: ${q.assumed}`,`Answer: ${v}`,"");}});
    return {n,text:lines.join("\n"),data};};
  const copy=async c=>{try{await navigator.clipboard.writeText(c.text); st.textContent=`${c.n} answer${c.n>1?"s":""} copied. Paste into an email to lauren@laurenberkowitz.co.`;}
    catch(e){const fb=document.getElementById("fb"); fb.value=c.text; document.getElementById("fbw").hidden=false; fb.select(); st.textContent="Select the text below and copy it.";}};
  document.getElementById("copyBtn").addEventListener("click",()=>{const c=collect(); if(!c.n){st.textContent="No answers entered yet.";return;} copy(c);});
  form.addEventListener("submit",async e=>{e.preventDefault(); const c=collect(); if(!c.n){st.textContent="No answers entered yet.";return;}
    const b=document.getElementById("sendBtn"); b.disabled=true; st.textContent="Sending...";
    try{const r=await fetch(FORMSPREE,{method:"POST",headers:{"Content-Type":"application/json","Accept":"application/json"},body:JSON.stringify({_subject:"Refine this request: answers from Minh Than",message:c.text,...c.data})});
      if(!r.ok) throw new Error(r.status); st.textContent=`Sent. ${c.n} answer${c.n>1?"s":""} delivered to lauren@laurenberkowitz.co. Thank you.`;}
    catch(err){b.disabled=false; st.textContent='Sending did not go through. Use "Copy my answers instead" and paste them into an email to lauren@laurenberkowitz.co.';}});
}

function render(){
  const v=query?searchView():current==="overview"?overview():current==="request"?request():current==="outside"?outside():current==="refine"?refine():list(LISTS.find(l=>l[0]===current)[1]);
  document.getElementById("read").innerHTML=v;
  nav.querySelectorAll("button[data-s]").forEach(b=>b.setAttribute("aria-current",!query&&b.dataset.s===current));
  wireForm();
}
function go(id){current=id; query=""; document.getElementById("q").value=""; render(); document.getElementById("center").scrollTo({top:0}); window.scrollTo({top:0});}

function panel(id){
  const f=byId(id); if(!f) return; selected=id;
  const st=STAT[f.status];
  const rows=[["Evidence of interest",f.evidence_of_interest],["Evidence date",f.evidence_date],["Covers pancreatic",f.pancreatic_coverage],["Open calls, Oct 2026 to Oct 2027",f.open_calls_oct2026_oct2027],["Academic investigator can apply",f.prime_eligibility_academic],["How to apply",f.intake_route],...(f.industry_route&&f.industry_route!=="n/a"?[["Industry route",f.industry_route]]:[]),["Typical award size",f.typical_award_size],["Possible project",f.concept],["Watch for",f.watch_out]];
  document.getElementById("pbody").innerHTML=`<div class="tierline"><span class="eyebrow">${esc(f.list)}</span><span class="chip ${st[1]}">${st[0]}</span></div>
  <h2>${esc(f.name)}</h2><p style="font-size:15px">${esc(f.who)}</p>
  <div class="pbox"><div class="eyebrow">Tier</div><div style="font-weight:600;color:var(--teal)">${esc(f.tier)}</div></div>
  <div class="pbox"><dl>${rows.map(([k,v])=>`<dt>${esc(k)}</dt><dd>${esc(v||"Not found")}</dd>`).join("")}</dl></div>
  ${f.src.map(s=>`<div class="ex"><div class="eyebrow">&#10003; Source excerpt</div>${s.x?`<q>${esc(s.x)}</q>`:""}<div class="src">${esc(s.c)}<br><a href="${esc(s.u)}" target="_blank" rel="noopener">${esc(s.t)}</a>${s.d?` · ${esc(s.d)}`:""}</div></div>`).join("")}`;
  document.querySelectorAll(".rec").forEach(r=>r.setAttribute("aria-pressed",r.dataset.f===id));
  const p=document.getElementById("panel"); p.classList.add("open"); p.scrollTo({top:0});
}
document.addEventListener("click",e=>{
  const a=e.target.closest("[data-f]"); if(a){e.preventDefault(); panel(a.dataset.f); return;}
  const g=e.target.closest("[data-go]"); if(g){e.preventDefault(); go(g.dataset.go);}
});
document.getElementById("closeP").addEventListener("click",()=>document.getElementById("panel").classList.remove("open"));
document.getElementById("q").addEventListener("input",e=>{query=e.target.value.trim(); render();});

const h=location.hash.replace("#","");
if(SECTIONS.some(s=>s.id===h)) current=h;
render();
panel("G1");
if(window.matchMedia("(max-width:1180px)").matches) document.getElementById("panel").classList.remove("open");
</script>
</body></html>
